<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Dispatch Dashboard</title>
  <link rel="stylesheet" href="/static/style.css?v=3" />
</head>
<body>
  <nav class="top"><a href="/">Client booking form &rarr;</a></nav>
  <main class="page">
    <h1>Dispatch Dashboard</h1>
    <p class="subtitle">Every booking request comes in here. Pick a date and generate a sequenced route.</p>

    <div id="notifications"></div>

    <section>
      <h2>Incoming orders</h2>
      <div id="orders-table" class="table-wrap"><p class="muted">Loading...</p></div>

      <div id="edit-order-section" hidden>
        <h3>Edit order</h3>
        <form id="edit-order-form">
          <input type="hidden" name="job_id" />
          <div class="row">
            <label>Full name<input type="text" name="customer_name" required /></label>
            <label>Phone<input type="tel" name="phone" /></label>
          </div>
          <div class="row">
            <label>Address<input type="text" name="address_raw" required /></label>
            <label>Postal code<input type="text" name="postal_code" inputmode="numeric" pattern="\d{6}" maxlength="6" required /></label>
          </div>
          <div class="row">
            <label>Order type
              <select name="job_type">
                <option value="pet_food_box">Subscription box</option>
                <option value="one_off_pet_order">One-off order</option>
                <option value="other">Other</option>
                <option value="other">Other</option>
              </select>
            </label>
            <label>Delivery date<input type="date" name="delivery_date" required /></label>
          </div>
          <div class="row">
            <label>Earliest<input type="time" name="window_start" required /></label>
            <label>Latest<input type="time" name="window_end" required /></label>
            <label>Duration (min)<input type="number" name="duration_minutes" min="5" step="5" required /></label>
          </div>
          <label>Notes<textarea name="notes" rows="2"></textarea></label>
          <div class="row">
            <button type="submit">Save changes</button>
            <button type="button" id="cancel-edit-btn">Cancel</button>
          </div>
          <p id="edit-order-error" class="result result--error" hidden></p>
        </form>
      </div>
    </section>

    <section>
      <h2>Generate route plan</h2>
      <div class="row">
        <label>
          Delivery date
          <input type="date" id="date-input" />
        </label>
        <button id="generate-btn">Generate Route Plan</button>
      </div>
      <p id="dates-hint" class="muted"></p>
      <div id="map"><p class="muted">Loading map...</p></div>
      <p id="map-note" class="muted"></p>
      <div id="plan-output" class="table-wrap"></div>
    </section>
  </main>
  <script src="/static/admin.js?v=3"></script>
</body>
</html>
