<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Majestic Fighters Furniture Delivery</title>
  <link rel="stylesheet" href="/static/chat.css?v=2" />
</head>
<body>
  <div class="wa-app">
    <header class="wa-header">
      <div class="wa-avatar">🛋️</div>
      <div>

        <div class="wa-status">online</div>
